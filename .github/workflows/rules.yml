name: Rules engine

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (rules assembly must compile as netstandard2.1 / C# 9 for Unity)
        run: dotnet build dotnet/Rules --configuration Release
      - name: Tests
        run: dotnet test dotnet/Rules.Tests --configuration Release
      - name: AI-vs-AI smoke sim
        run: dotnet run --project dotnet/Cli --configuration Release -- sim --matches 4 --seed 1
